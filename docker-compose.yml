services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    image: jhound-n8n:local
    container_name: jHound-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_INSTANCE_OWNER_EMAIL=${USER_EMAIL:-mubarak@codeswot.me}
      - N8N_INSTANCE_OWNER_PASSWORD=${N8N_INSTANCE_OWNER_PASSWORD}
      - N8N_INSTANCE_OWNER_FIRST_NAME=${N8N_INSTANCE_OWNER_FIRST_NAME:-Mubarak}
      - N8N_INSTANCE_OWNER_LAST_NAME=${N8N_INSTANCE_OWNER_LAST_NAME:-Ibrahim}
      - N8N_SECURE_COOKIE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_PROXY_HOPS=1
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_INTERNAL_URL=${N8N_INTERNAL_URL:-http://localhost:5678}
      - GENERIC_TIMEZONE=Africa/Lagos
      - EXECUTIONS_DATA_PRURESEND_FROMNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - N8N_DEFAULT_ERROR_WORKFLOW=jhound07errorhandler
      - NODES_EXCLUDE=[]
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:?OLLAMA_API_KEY is required — get one at https://ollama.com}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gpt-oss:120b-cloud}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-180}
      - HUNTER_API_KEY=${HUNTER_API_KEY:-}
      - HUNTER_MONTHLY_LIMIT=${HUNTER_MONTHLY_LIMIT:-80}
      - HUNTER_WEEKLY_LIMIT=${HUNTER_WEEKLY_LIMIT:-20}
      - HUNTER_DAILY_LIMIT=${HUNTER_DAILY_LIMIT:-10}
      - HUNTER_TIER1_ONLY=${HUNTER_TIER1_ONLY:-true}
      - HUNTER_CACHE_DAYS=${HUNTER_CACHE_DAYS:-30}
      - APOLLO_API_KEY=${APOLLO_API_KEY:-}
      - APOLLO_TIER1_ONLY=${APOLLO_TIER1_ONLY:-false}
      - APOLLO_MONTHLY_LIMIT=${APOLLO_MONTHLY_LIMIT:-500}
      - APOLLO_CACHE_DAYS=${APOLLO_CACHE_DAYS:-30}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - USER_EMAIL=${USER_EMAIL}
      - NOSTR_NSEC=${NOSTR_NSEC:?NOSTR_NSEC is required — run `node scripts/nostr_notifier.js keygen` to generate}
      - NOSTR_TARGET_NPUB=${NOSTR_TARGET_NPUB:?NOSTR_TARGET_NPUB is required — paste your personal npub here}
      - NOSTR_RELAYS=${NOSTR_RELAYS:-wss://relay.damus.io,wss://relay.primal.net,wss://nos.lol}
      - RESEND_WEBHOOK_PATH=${RESEND_WEBHOOK_PATH:-jhound-resend-inbound-CHANGE_ME}
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:-}
      - FOLLOW_UP_AFTER_DAYS=${FOLLOW_UP_AFTER_DAYS:-7}
      - MAX_FOLLOW_UPS=${MAX_FOLLOW_UPS:-2}
      - JOBSPY_PROXIES=${JOBSPY_PROXIES:-}
      - METABASE_URL=http://metabase:3000
      - METABASE_ADMIN_EMAIL=${USER_EMAIL:-mubarak@codeswot.me}
      - METABASE_ADMIN_PASSWORD=${METABASE_ADMIN_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=jhound
      - POSTGRES_USER=jhound
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - n8n_data:/home/node/.n8n
      - ./scripts:/home/node/scripts
      - ./workflows:/home/node/workflows
      - ./data:/home/node/data
      - ./resources:/home/node/resources
      - ./tests:/home/node/tests
    depends_on:
      - postgres
      - redis
    networks:
      - jhound
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    container_name: jHound-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=jhound
      - POSTGRES_USER=jhound
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - jhound
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jhound -d jhound"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jHound-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - jhound
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jHound-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${USER_EMAIL:-mubarak@codeswot.me}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - jhound
    profiles:
      - admin

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: jhound-api:local
    container_name: jHound-api
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-3100}:3000"
    environment:
      - NODE_ENV=production
      - API_PORT=3000
      - API_TOKEN=${API_TOKEN:?API_TOKEN required}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=jhound
      - POSTGRES_USER=jhound
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - N8N_INTERNAL_URL=http://n8n:5678
      - NOSTR_TARGET_NPUB=${NOSTR_TARGET_NPUB}
      - RESEND_API_KEY=${RESEND_API_KEY:?RESEND_API_KEY required for api}
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:-}
      - RESEND_WEBHOOK_INSECURE=${RESEND_WEBHOOK_INSECURE:-false}
      - RESEND_FROM=${RESEND_FROM:-${USER_EMAIL}}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jhound
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  metabase:
    image: metabase/metabase:latest
    container_name: jHound-metabase
    restart: unless-stopped
    ports:
      - "${METABASE_HOST_PORT:-3001}:3000"
    environment:
      - MB_SITE_NAME=jHound
      - MB_SITE_LOCALE=en
      - MB_ADMIN_EMAIL=${METABASE_ADMIN_EMAIL:-mubarak@codeswot.me}
      - MB_ADMIN_PASSWORD=${METABASE_ADMIN_PASSWORD}
      - JAVA_TIMEZONE=Africa/Lagos
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      - postgres
    networks:
      - jhound
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  n8n_data:
  postgres_data:
  redis_data:
  pgadmin_data:
  metabase_data:

networks:
  jhound:
    driver: bridge
