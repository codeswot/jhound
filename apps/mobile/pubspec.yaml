name: jhound_mobile
description: jHound control app — jobs, inbox, drafts.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7

  dio: ^5.7.0
  socket_io_client: ^3.0.2

  flutter_secure_storage: ^9.2.2

  drift: ^2.20.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  intl: ^0.19.0
  flutter_widget_from_html: ^0.17.2

  nostr_tools: ^1.0.9
  file_picker: ^8.1.2
  local_auth: ^2.3.0
  crypto: ^3.0.3
  url_launcher: ^6.3.0  

dev_dependencies:
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
